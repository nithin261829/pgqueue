name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      PGQUEUE_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres
      PGQUEUE_DSN: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
      - name: Benchmark with crashing workers
        run: go run ./cmd/bench -jobs 5000 -workers 4 -concurrency 8 -crashes 2
